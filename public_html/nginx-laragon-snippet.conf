# On this machine, the same rules are applied in:
#   C:\laragon\etc\nginx\sites-enabled\00-default.conf
# After edits there, run: Multi-Hospital\scripts\reload-laragon-nginx.ps1
#
# On another PC, paste the `location` blocks below into your Laragon nginx `server { }`
# (Laragon → Nginx → sites-enabled → your site, or edit auto.*.conf).
#
# REQUIREMENTS:
# 1) `root` must be the folder that CONTAINS index.php (this Multi-Hospital directory),
#    e.g.  root C:/Users/You/Pictures/doctor/Multi-Hospital;
# 2) `index index.php;` should be set (Laragon usually does this).
#
# This mirrors .htaccess: send non-files to CodeIgniter front controller.

location / {
    try_files $uri $uri/ @ci_rewrite;
}

location @ci_rewrite {
    rewrite ^/(.*)$ /index.php?/$1 last;
}

# Do not add another `location ~ \.php$` block — Laragon already defines PHP handling.
# If you still get 404, confirm `root` points at this folder (where index.php lives).

# Optional: long cache for versioned static assets (after deploy, bump $config['asset_version'] in CI).
# Place INSIDE the same `server { }` as the site, AFTER the location blocks above.
#
# location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
#     expires 30d;
#     add_header Cache-Control "public, immutable";
#     try_files $uri =404;
# }
